apply plugin: "com.android.application"

android {
    namespace "com.dxstudio.player"
    compileSdk 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.dxstudio.player"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
        ndk { abiFilters "arm64-v8a", "x86_64" }
        externalNativeBuild {
            cmake { cppFlags "-std=c++20 -Wall -Wextra" }
        }
    }
    externalNativeBuild {
        cmake { path file("src/main/cpp/CMakeLists.txt"); version "3.22.1" }
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
}
